# Render deployment configuration for AI Agent Beast
services:
  - type: web
    name: ai-agent-beast
    env: python
    buildCommand: pip install -r requirements-production.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
