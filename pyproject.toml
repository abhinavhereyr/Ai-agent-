# ---------------------------------------------------------------------------
# Project metadata — required by Vercel's uv-based Python builder
# ---------------------------------------------------------------------------
[project]
name = "ai-agent-beast"
version = "1.0.0"
description = "AI Agent Beast — free AI agent (desktop/Android/web automation) with Meta Llama 3 via Groq Cloud and a local Ollama fallback."
requires-python = ">=3.8"
# Mirrors requirements.txt, plus the extra top-level imports the serverless
# entrypoint's import chain needs at runtime (numpy from modules/voice.py,
# bs4 from modules/web_tools.py). Heavy/desktop deps (transformers,
# sounddevice, scipy, pyttsx3, mss, pyperclip) are lazy-imported inside
# functions, so they are intentionally NOT installed on the build machine.
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "requests>=2.31.0",
    "websockets>=12.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "pyautogui>=0.9.54",
    "ollama>=0.1.7",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "numpy>=1.24.0",
    "beautifulsoup4>=4.12.0",
]

# ---------------------------------------------------------------------------
# Vercel FastAPI entrypoint
# ---------------------------------------------------------------------------
# Vercel's framework detection fails when the root main.py has no top-level
# FastAPI instance ("Found main.py but it does not define a top-level 'app").
# Point the serverless build at the real ASGI app. web.api_server is a pure
# REST API (no auth gate, no WebSocket) so it is serverless-viable, while the
# full dashboard (web/app.py) still runs locally or behind the keep_alive.sh
# tunnel.
[tool.vercel]
entrypoint = "web.api_server:app"
